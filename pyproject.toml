[project]
name = "linreg"
version = "0.1.0"
description = "Linear regression from scratch (numpy only) - Day 1 of a 7-day AI engineer bootcamp"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
